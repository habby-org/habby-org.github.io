<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-itunes-app" content="app-id=6790799084" />
    <link rel="icon" href="./assets/habby-icon.png?v=20260921" />
    <link rel="apple-touch-icon" href="./assets/habby-icon.png?v=20260921" />
    <title>habby を開いています</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(145deg, #00B3A6, #7AC943);
        color: #2E3440;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      }
      main {
        width: min(100%, 380px);
        padding: 32px 24px;
        text-align: center;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 28px;
        box-shadow: 0 20px 48px rgba(31, 59, 53, 0.25);
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 22%;
        display: block;
        object-fit: cover;
      }
      h1 { margin: 0; font-size: 21px; font-weight: 800; }
      p { margin: 12px 0 0; color: #5F6875; font-size: 14px; line-height: 1.65; }
      a {
        display: inline-block;
        margin-top: 24px;
        padding: 13px 20px;
        border-radius: 999px;
        background: #F0F3F5;
        color: #00A89C;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
      a.secondary {
        display: none;
        margin-top: 12px;
        background: transparent;
        color: #5F6875;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="./assets/habby-icon.png?v=20260921" alt="habby" />
      <h1>habby を開いています</h1>
      <p id="message">アプリをお持ちの場合は、下のボタンから habby を開けます。</p>
      <a id="open-app" href="/intro/">habby で開く</a>
      <a class="secondary" id="fallback" href="/intro/">habby の紹介を見る</a>
    </main>
    <script src="./invite.js"></script>
  </body>
</html>
