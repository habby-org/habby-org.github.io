name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  # So a release of the app can publish itself without a commit here:
  #   gh api repos/habby-org/habby-org.github.io/dispatches -f event_type=app-updated
  repository_dispatch:
    types:
      - app-updated
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Without this, a missing or under-scoped token surfaces as a bare "Repository not found"
      # from actions/checkout, which reads as though habby-org/app had been deleted rather than
      # simply being unreadable from here.
      - name: Check the app repository token is present
        env:
          APP_REPO_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
        run: |
          if [ -z "${APP_REPO_TOKEN}" ]; then
            echo "::error::APP_REPO_TOKEN is not set, so this build cannot read habby-org/app."
            echo "habby-org/app is private, and the default GITHUB_TOKEN is scoped to this"
            echo "repository only. Create a fine-grained personal access token with"
            echo "Contents: Read on habby-org/app, and store it here as the APP_REPO_TOKEN secret."
            exit 1
          fi

      - name: Check out this site
        uses: actions/checkout@v4

      # habby-org/app is private, so this needs a token that can read it — a fine-grained PAT with
      # Contents: Read on habby-org/app, stored here as APP_REPO_TOKEN. The default GITHUB_TOKEN is
      # scoped to this repository and cannot reach the other one.
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          repository: habby-org/app
          ref: main
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: .app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            .app/gradle/wrapper/gradle-wrapper.properties
            .app/gradle/libs.versions.toml

      # The runner's own Android SDK, because the app module applies the Android application plugin
      # even when only the web target is being built. No `local.properties` is needed: the plugin
      # falls back to ANDROID_HOME, which the runner image already sets.
      # HABBY_LIFF_ID names the LIFF app LINE redirects back to, and a LIFF app is tied to one
      # endpoint URL — so it belongs to this deployment rather than to the app repository. Without
      # it the site still builds and still shows the LINE button; the button then reports that the
      # build was not configured for login.
      - name: Build the web app
        working-directory: .app
        env:
          HABBY_LIFF_ID: ${{ secrets.HABBY_LIFF_ID }}
        run: ./gradlew --no-daemon :composeApp:wasmJsBrowserDistribution

      - name: Assemble the site
        env:
          # Play Console → App integrity → App signing key certificate → SHA-256. This is the
          # Google Play signing certificate, not the local upload-key certificate.
          ANDROID_APP_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_APP_SIGNING_CERT_SHA256 }}
          # A private development/debug signing certificate used for locally installed builds.
          # It is intentionally separate from the Play App Signing certificate above.
          ANDROID_DEBUG_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_DEBUG_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/intro _site/invite _site/.well-known
          cp -R .app/composeApp/build/dist/wasmJs/productionExecutable/. _site/
          # Source maps are a third of the payload and only useful with the sources, which are not
          # published here.
          rm -f _site/*.js.map
          cp -R intro/. _site/intro/
          cp -R invite/. _site/invite/
          cp .well-known/apple-app-site-association _site/.well-known/
          if [ -n "${ANDROID_APP_SIGNING_CERT_SHA256}" ] || [ -n "${ANDROID_DEBUG_SIGNING_CERT_SHA256}" ]; then
            jq \
              --arg production "${ANDROID_APP_SIGNING_CERT_SHA256}" \
              --arg debug "${ANDROID_DEBUG_SIGNING_CERT_SHA256}" \
              '
                . as $template
                | [ $production, $debug | select(length > 0) ]
                | unique
                | . as $certificates
                | $template
                | map(.target.sha256_cert_fingerprints = $certificates)
              ' .well-known/assetlinks.json.template > _site/.well-known/assetlinks.json
          else
            # Do not publish an incorrect upload-key fingerprint. iOS Universal Links and the
            # uninstalled-app store fallback stay live, while Android verification turns on once
            # a signing certificate SHA-256 is saved as a repository secret and Pages is redeployed.
            echo "::warning::No Android signing certificate SHA-256 is configured; Android App Links are disabled."
            printf '[]\n' > _site/.well-known/assetlinks.json
          fi
          cp .nojekyll robots.txt sitemap.xml _site/
          echo "--- assembled site ---"
          du -sh _site
          ls -la _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
